version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pet_shelter_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pet_shelter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pet_shelter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
